services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: emiyoga_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - emiyoga

  nginx:
    image: nginx:1.27-alpine
    container_name: emiyoga_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - emiyoga

  mysql:
    image: mysql:8.0
    container_name: emiyoga_mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-emiyoga}
      MYSQL_USER: ${DB_USER:-emiyoga}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - emiyoga

  node:
    image: node:22-alpine
    container_name: emiyoga_node
    working_dir: /var/www/html
    profiles: ["build"]
    volumes:
      - ./:/var/www/html
    networks:
      - emiyoga

volumes:
  mysql_data:

networks:
  emiyoga:
    driver: bridge
